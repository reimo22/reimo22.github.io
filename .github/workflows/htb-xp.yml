name: Poll HTB XP

on:
  schedule:
    # Daily 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: htb-xp
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Probe candidate XP endpoints (temporary)
        if: github.event_name == 'pull_request'
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: node scripts/probe-xp.mjs
      - name: Record the current profile XP
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: node scripts/htb-xp.mjs
      - name: Open a PR if XP moved
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/_data/htb.json)" ]; then
            echo "xp unchanged; nothing to do"
            exit 0
          fi
          branch="chore/htb-xp-$(date +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/htb.json
          git commit -m "chore(htb): record profile XP"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(htb): record profile XP" \
            --body "Daily XP poll found a change. Merge is a manual human step so the site only ships reviewed data."
